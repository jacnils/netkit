name: CMake for Nintendo Wii

on:
  push:
    branches: ["master"]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/**'
  pull_request:
    branches: ["master"]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-wii:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -e
            
          apt-get update
          apt-get install -y cmake

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${DEVKITPRO}/cmake/Wii.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNETKIT_ENABLE_TESTS=OFF \
            -DNETKIT_BUILD_SHARED=OFF

      - name: Build library
        run: cmake --build build --parallel 2
